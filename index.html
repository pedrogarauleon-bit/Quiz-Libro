      { isbn: "9788445007006", title: "El ojo del mundo", author: "Robert Jordan", description: "La historia ya ha ocurrido antes. Y volverá a ocurrir. Cuando las sombras llegan hasta un pequeño pueblo y obligan a Rand y sus amigos a huir, no saben que acaban de entrar en el entramado de una historia que se repite desde hace miles de años. La Rueda gira de nuevo, el Dragón ha vuelto y el poder que una vez destruyó el mundo sigue esperando en la sangre de los hombres." },
      { isbn: "9788410466135", title: "Carl el Mazmorrero", author: "Matt Dinniman", description: "Cuando el mundo termina, Carl sobrevive por pura casualidad: estaba fuera buscando a la gata de su exnovia. Poco después descubre que la humanidad ha sido encerrada en una gigantesca mazmorra convertida en un reality show para alienígenas." },
      { isbn: "9788445019825", title: "Zangetsuki. Crónicas de la luna", author: "Masakuni Oda", description: "Takashi Otsuki lo tiene todo: una familia, un buen trabajo y una vida tranquila. Hasta que una noche sus hijos dejan de reconocerlo y su mujer lo echa de casa. Alguien ocupa su lugar y nadie parece encontrar nada extraño en ello. Takashi tendrá que descubrir qué le ha ocurrido antes de que sus propios recuerdos empiecen a desaparecer." },
      { isbn: "9788415130093", title: "Solaris", author: "Stanislaw Lem", description: "Kris Kelvin llega a Solaris para investigar qué está ocurriendo con los científicos de una estación espacial. Allí descubre que el océano que cubre el planeta parece tener vida propia y que está haciendo aparecer personas que deberían estar muertas. Entre ellas está su mujer, que se suicidó años atrás." },
      { isbn: "9791370136383", title: "Berserk Master Edition 1", author: "Kentaro Miura", description: "Guts es un mercenario que ha aprendido a vivir solo, espada en mano y sin deberle nada a nadie. Hasta que conoce a Griffith, el líder de la Banda del Halcón, un hombre que parece destinado a conseguir todo aquello que Guts nunca ha tenido: un sueño. Entre batallas, ambición y sangre, los dos acabarán descubriendo cuánto puede costar perseguirlo." },
      { isbn: "9788467972979", title: "Mujina Into the Deep 01. Edición especial", author: "Inio Asano", description: "En Tsukumo, los *mujina* son personas que han renunciado a sus derechos para poder vivir fuera de la ley. Asa es una de ellas y trabaja como asesina a sueldo, matando con su katana a quien le encarguen. Pero mientras intenta sobrevivir en una ciudad cada vez más violenta, empieza a preguntarse cuánto puede perder antes de dejar de ser libre." },
      { isbn: "9788412930627", title: "Bibliomania: Edición Deluxe", author: "Macchiro y Obaru", description: "Alice despierta en una residencia donde puede conseguir todo lo que desea, pero tiene prohibido salir de su habitación. Cuando decide escapar, descubre que cuanto más se acerca a la puerta, más se pudre su cuerpo. Para sobrevivir tendrá que descubrir por qué está atrapada allí y qué se esconde detrás de esa aparente vida perfecta." },
      { isbn: "9781910856161", title: "Barrio lejano. Edición definitiva", author: "Jirō Taniguchi", description: "Hiroshi, un hombre de mediana edad, se encuentra de repente en su cuerpo de adolescente, pero conserva todos sus recuerdos de adulto. Al volver a vivir con su familia descubre que puede cambiar las decisiones que marcaron su vida. Sin embargo, hay una cosa que no puede olvidar: su padre desapareció cuando él tenía catorce años, y esta vez quizá pueda impedirlo." },
      { isbn: "9781908007438", title: "El perro enamorado de las estrellas", author: "Takashi Murakami", description: "Un hombre que ha perdido a su familia y su rumbo emprende un viaje por carretera acompañado de un perro. Una historia emotiva sobre la amistad, la soledad, la lealtad y las segundas oportunidades." },
      { isbn: "9788467962789", title: "Buenas Noches, Punpun 01", author: "Inio Asano", description: "Punpun crece en una familia rota y descubre demasiado pronto el amor, el sexo y la crueldad del mundo. Su vida se irá llenando de experiencias cada vez más oscuras, hasta llevarlo al límite. Pero incluso después de tocar fondo, quizá todavía quede una razón para seguir viviendo." },
      { isbn: "9788467963120", title: "Solanin", author: "Inio Asano", description: "Meiko y Taneda han terminado la universidad, pero no saben qué hacer con sus vidas. Entre trabajos que odian, una banda que lucha por salir adelante y sueños que parecen cada vez más lejanos, intentan encontrar una razón para seguir adelante. Hasta que la vida les obliga a enfrentarse a algo que ninguno de los dos estaba preparado para perder." },
      { isbn: "9788416693535", title: "Parasyte nº 01/08", author: "Hitoshi Iwaaki", description: "Una noche, unos parásitos comienzan a invadir a los humanos para apoderarse de sus cuerpos. Shinichi consigue evitar que uno llegue a su cerebro, pero acaba viviendo en su mano, y ambos se ven obligados a convivir para sobrevivir. Mientras otros parásitos cazan humanos por toda la ciudad, Shinichi empieza a preguntarse qué significa realmente ser humano." },
    ];
    const NATURE_BOOKS = {
      Fuerte: [0, 1],
      Dócil: [2, 3],
      Osada: [4, 5],
      Alegre: [6, 7],
      Agitada: [8, 9],
      Ingenua: [10, 11],
      Miedosa: [12, 13],
      Activa: [14, 15],
      Grosera: [16, 17],
      Serena: [18, 19],
      Plácida: [20, 21],
      Huraña: [22, 23],
      Rara: [24, 25],
      Mansa: [26],
      Alocada: [27],
      Audaz: [28],
    };
    const STRINGS = { ResultMessage: "El libro que parece haberte elegido es...", Restart: "Volver a empezar" };
    const app = document.getElementById("app"),
      music = document.getElementById("music"),
      clickSound = document.getElementById("clickSound");
    let selected = [],
      index = 0,
      points = {},
      maxPoints = {},
      bestNature = null,
      selectedChoice = false;
    function esc(s) {
      return String(s).replace(
        /[&<>"']/g,
        (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]
      );
    }
    function startMusic() {
      music.volume = 0.35;
      music.play().catch(() => { });
    }
    function click() {
      clickSound.currentTime = 0;
      clickSound.volume = 0.55;
      clickSound.play().catch(() => { });
    }
    function intro() {
      app.innerHTML = `<div class="screen"><div class="intro panel"><p>Una mañana despiertas en un lugar que no reconoces.</p><p>No sabes cómo has llegado hasta allí.</p><p>A tu alrededor hay un bosque cubierto de niebla. Entre los árboles puedes distinguir una silueta que parece observarte.</p><p>No llevas nada contigo salvo un extraño libro.</p><p>En su portada no aparece ningún título.</p><div class="quote"><p>«Los libros no siempre son elegidos por quienes los leen.»</p><p>«A veces son ellos quienes eligen a su lector.»</p></div><p>Para descubrir qué libro te ha elegido, tendrás que responder a las siguientes preguntas.</p><p>No existen respuestas correctas o incorrectas.</p><div class="continue">Haz clic para continuar ↓</div></div></div>`;
      document.querySelector(".intro").onclick = () => {
        startMusic();
        modes();
      };
    }
    function modes() {
      app.innerHTML = `<div class="screen"><div class="panel" style="margin-bottom:20px"><h1>Puedes buscar una respuesta </h1><div class="sub">o dejar que te encuentre</div></div><div class="modeGrid"><button class="mode panel" id="normal"><h2>Buscar una respuesta</h2><small>10 preguntas · recomendado</small></button><button class="mode panel" id="full"><h2>Dejar que te encuentre</h2><small>64 preguntas · más preciso</small></button></div></div>`;
      document.getElementById("normal").onclick = () => {
        click();
        begin(10);
      };
      document.getElementById("full").onclick = () => {
        click();
        begin(64);
      };
    }
    function reset() {
      points = {};
      NATURES.forEach((n) => (points[n] = 0));
      maxPoints = {};
      NATURES.forEach((n) => (maxPoints[n] = 0));
      QUESTIONS.forEach((q) =>
        q.responses.forEach((a) => a.scores.forEach((s) => (maxPoints[s.nature] += s.points)))
      );
    }
    function begin(n) {
      startMusic();
      reset();
      selected = [];
      index = 0;
      if (n === 64) selected = [...QUESTIONS];
      else {
        let pool = [...QUESTIONS];
        while (selected.length < n) {
          let i = Math.floor(Math.random() * pool.length);
          selected.push(pool.splice(i, 1)[0]);
        }
      }
      showQuestion();
    }
    function showQuestion() {
      if (index >= selected.length) {
        showNature();
        return;
      }
      const q = selected[index];
      app.innerHTML = `<div class="screen"><div class="progress">Pregunta ${index + 1} de ${selected.length}</div><div class="qtitle panel"><h1>${esc(q.title)}</h1></div><div class="answers" id="answers"></div></div>`;
      const box = document.getElementById("answers");
      q.responses.forEach((a, i) => {
        const b = document.createElement("button");
        b.className = "answer panel";
        b.innerHTML = esc(a.response);
        b.onmouseenter = () => {
          [...box.children].forEach((x, j) => x.classList.toggle("disabled", j !== i && selectedChoice));
        };
        b.onmouseleave = () => {
          [...box.children].forEach((x) => x.classList.remove("disabled"));
        };
        b.onclick = () => {
          if (selectedChoice) return;
          selectedChoice = true;
          a.scores.forEach((s) => (points[s.nature] += s.points));
          b.classList.add("selected");
          click();
          [...box.children].forEach((x, j) => {
            if (j !== i) x.classList.add("disabled");
          });
          setTimeout(() => {
            selectedChoice = false;
            index++;
            showQuestion();
          }, 240);
        };
        box.appendChild(b);
      });
    }
    function weighted() {
      let w = {};
      NATURES.forEach((n) => (w[n] = maxPoints[n] ? points[n] / maxPoints[n] : 0));
      return w;
    }
    function getBest() {
      const w = weighted();
      let mx = Math.max(...NATURES.map((n) => w[n]));
      return NATURES.filter((n) => w[n] === mx)[0];
    }
    function showNature() {
      bestNature = getBest();
      let parts = DESCRIPTIONS[bestNature]
        .split(".")
        .map((x) => x.trim())
        .filter(Boolean)
        .map((x) => x + ".");
      let i = 0;
      function draw() {
        app.innerHTML = `<div class="screen" id="nature"><div class="nature panel">${esc(parts[i])}</div><div class="tap">Toca o haz clic para continuar<div class="arrow"></div></div></div>`;
        document.getElementById("nature").onclick = () => {
          click();
          i++;
          if (i >= parts.length) showResult();
          else draw();
        };
      }
      draw();
    }
    function loadCover(img, book) {
      img.src = "./files/img/covers/" + book.isbn + ".webp";
      return;
    }
    function chooseBook() {
      const candidates = NATURE_BOOKS[bestNature] || BOOKS.map((_, i) => i);
      return BOOKS[candidates[Math.floor(Math.random() * candidates.length)]];
    }
    function showResult() {
      const book = chooseBook();
      const w = weighted();
      app.innerHTML = `<div class="screen"><div class="result"><div class="resultSide"><div class="resultTitle">${esc(STRINGS.ResultMessage)}</div><div class="bookCard"><div class="coverFrame"><img id="bookCover" class="cover" alt="Portada de ${esc(book.title)}"></div><div class="bookTitle">${esc(book.title)}</div><div class="author">${esc(book.author)}</div><div class="isbn">ISBN ${esc(book.isbn)}</div><div class="bookHint">${esc(book.description)}</div></div><button class="restart" id="restart">↻ ${esc(STRINGS.Restart)}</button></div><div class="resultSide chartSide"><div class="panel"><h2>Tu perfil</h2><div class="sub">Así ha respondido tu personalidad al cuestionario.</div><div class="chartWrap">${chartSvg(w)}</div></div></div></div></div>`;
      loadCover(document.getElementById("bookCover"), book);
      document.getElementById("restart").onclick = () => {
        click();
        modes();
      };
    }
    function chartSvg(w) {
      const cx = 300,
        cy = 300,
        r = 200,
        n = NATURES.length;
      const colors = {
        Fuerte: "#7dd3fc",
        Dócil: "#86efac",
        Osada: "#fbbf24",
        Alegre: "#f9a8d4",
        Agitada: "#f472b6",
        Ingenua: "#c4b5fd",
        Miedosa: "#60a5fa",
        Activa: "#34d399",
        Grosera: "#facc15",
        Serena: "#a7f3d0",
        Plácida: "#8b5cf6",
        Huraña: "#a78bfa",
        Rara: "#f0abfc",
        Mansa: "#67e8f9",
        Alocada: "#fdba74",
        Audaz: "#f87171",
      };
      const accent = colors[bestNature] || "#7dd3fc";
      const maxWeight = Math.max(...NATURES.map((name) => w[name] || 0), 0.1);

      let pts = [];
      for (let i = 0; i < n; i++) {
        const name = NATURES[i];
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
        const normalized = Math.max(0.08, (w[name] || 0) / maxWeight);
        const rr = r * normalized;
        pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
      }

      let rings = "";
      for (let k = 1; k <= 5; k++) {
        const rr = (r * k) / 5;
        const p = [];
        for (let i = 0; i < n; i++) {
          const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
          p.push(`${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`);
        }
        rings += `<polygon class="radar-ring" points="${p.join(" ")}" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>`;
      }

      let axes = NATURES.map((name, i) => {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
        const x1 = cx + r * Math.cos(a);
        const y1 = cy + r * Math.sin(a);
        const x2 = cx + (r + 42) * Math.cos(a);
        const y2 = cy + (r + 42) * Math.sin(a);
        const isAccent = name === bestNature;
        return `
          <line class="radar-axis" x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text class="nature-label" x="${x2}" y="${y2}" fill="${isAccent ? accent : "rgba(255,255,255,0.88)"}" font-size="${isAccent ? 13 : 12}" font-weight="${isAccent ? 800 : 700}" text-anchor="middle" dominant-baseline="middle">${esc(name)}</text>
        `;
      }).join("");

      return `
        <svg class="chart" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <filter id="chartGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect x="0" y="0" width="600" height="600" rx="28" fill="rgba(10,16,28,0.82)"/>
          ${rings}
          ${axes}
          <polygon
            class="radar-shape"
            points="${pts.map((p) => p.join(",")).join(" ")}"
            style="fill:${accent}; fill-opacity:0.42; stroke:${accent}; stroke-width:3; filter:url(#chartGlow);"
          />
        </svg>
      `;
    }
    intro();
  </script>
</body>

</html>
